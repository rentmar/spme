<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ asunto|default:"Notificación SPME" }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header {
            background-color: {{ color|default:'#4CAF50' }};
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header .icono {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .content {
            padding: 30px;
        }
        .button {
            display: inline-block;
            padding: 12px 28px;
            background-color: {{ color|default:'#4CAF50' }};
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin: 20px 0;
            font-weight: bold;
        }
        .button-aprobar {
            background-color: #4CAF50;
        }
        .button-rechazar {
            background-color: #f44336;
        }
        .button-observar {
            background-color: #ff9800;
        }
        .button-ver {
            background-color: #2196F3;
        }
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
            background-color: #fafafa;
        }
        .info-box {
            background-color: #f8f9fa;
            border-left: 4px solid {{ color|default:'#4CAF50' }};
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .success-box {
            background-color: #d4edda;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .error-box {
            background-color: #f8d7da;
            border-left: 4px solid #dc3545;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .warning-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .info-table td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .info-table td:first-child {
            font-weight: bold;
            width: 35%;
        }
        .botones-accion {
            text-align: center;
            margin: 25px 0;
        }
        .botones-accion a {
            display: inline-block;
            margin: 5px;
        }
        @media (max-width: 600px) {
            .container {
                margin: 0;
                border-radius: 0;
            }
            .content {
                padding: 20px;
            }
            .botones-accion a {
                display: block;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icono">{{ icono|default:'📧' }}</div>
            <h1>{{ titulo|default:"Notificación del Sistema" }}</h1>
        </div>
        
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
        
        <div class="footer">
            <p>© {{ anio_actual|default:2024 }} {{ nombre_sistema|default:'SPME' }} - Todos los derechos reservados</p>
            <p>Este es un mensaje automático, por favor no responder a este correo.</p>
            <p><a href="{{ site_url }}" style="color: #888;">{{ site_url }}</a></p>
        </div>
    </div>
</body>
</html>
