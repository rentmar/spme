<!-- spme_email/templates/emails/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background-color: #f4f4f4;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f4; padding: 20px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #1a5276 0%, #2e86c1 100%); padding: 25px 40px; text-align: center;">
                            {% block header %}
                            <h2 style="color: #ffffff; margin: 0; font-size: 20px;">SPME</h2>
                            <p style="color: #d4e6f1; margin: 5px 0 0; font-size: 13px;">Sistema de Planificación y Monitoreo Estatal</p>
                            {% endblock %}
                        </td>
                    </tr>
                    
                    <!-- Contenido -->
                    <tr>
                        <td style="padding: 30px 40px;">
                            {% block content %}
                            {% endblock %}
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #f8f9fa; padding: 20px 40px; text-align: center; border-top: 1px solid #e9ecef;">
                            {% block footer %}
                            <p style="color: #999; font-size: 12px; margin: 0;">
                                © {{ current_year }} SPME - Todos los derechos reservados
                            </p>
                            <p style="color: #bbb; font-size: 11px; margin: 5px 0 0;">
                                Este es un email automático, por favor no responda a este mensaje.
                            </p>
                            {% endblock %}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
